<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insurance on the Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F4; --surface:#FFFFFF; --ink:#12202B; --muted:#586976; --line:#D3DCE1;
  --sign:#0F2A43; --sign-ink:#FFFFFF; --sign-muted:#B9C8D7; --sign-line:#274562;
  --ok:#23A06A; --warn:#E5A800; --alert:#C23B2E; --user:#D3E3F2; --focus:#1B6FD1;
  --btn:#0F2A43; --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151C; --surface:#15212B; --ink:#E7EEF3; --muted:#9BABB7; --line:#27394A;
    --sign:#0B2239; --sign-line:#2C4D6E; --user:#1D3954; --focus:#6AA9F0;
    --btn:#2D6CB5; --btn-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151C; --surface:#15212B; --ink:#E7EEF3; --muted:#9BABB7; --line:#27394A;
  --sign:#0B2239; --sign-line:#2C4D6E; --user:#1D3954; --focus:#6AA9F0;
  --btn:#2D6CB5; --btn-ink:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
*,*::before,*::after{box-sizing:inherit;}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;
}
button,input,textarea,select{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);}
.brand{min-width:0;flex:1;}
.brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap;}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-actions{display:flex;gap:8px;flex:none;}
.small-btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap;}
.small-btn:hover{background:var(--bg);}
.view{flex:1;min-height:0;display:flex;flex-direction:column;}

/* intake */
.intake{overflow-y:auto;padding:22px 18px 32px;}
.intake h2{margin:0 0 8px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.02em;}
.intake .lede{margin:0 0 20px;color:var(--muted);font-size:15px;}
.field{margin:0 0 16px;}
.field label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px;}
.field .hint{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px;}
.field input[type="text"],.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;}
.consent{display:flex;gap:10px;align-items:flex-start;margin:6px 0 18px;font-size:14px;}
.consent input{margin-top:3px;width:18px;height:18px;flex:none;}
.notice{margin:0 0 16px;padding:12px 14px;border-left:5px solid var(--warn);background:var(--surface);border-radius:6px;font-size:14px;}
.primary{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:16px;cursor:pointer;}
.primary:disabled{opacity:.45;cursor:not-allowed;}

/* chat */
#chat{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
#chat > *{flex:none;}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere;}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px;}
.msg.note{font-size:13.5px;color:var(--muted);}
.msg.alert{border-left:6px solid var(--alert);}
.msg a{color:inherit;font-weight:600;}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dot{animation:none;opacity:.6}}

/* the reply as a wayfinding sign */
.sign{align-self:stretch;background:var(--sign);color:var(--sign-ink);border:1px solid var(--sign-line);border-radius:14px;overflow:hidden;}
.sign-head{padding:16px 16px 12px;}
.sign-name{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-0.015em;}
.sign-addr{margin:6px 0 0;color:var(--sign-muted);font-size:14.5px;}
.sign-status{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:13.5px;}
.bullet{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;}
.bullet.ok{background:var(--ok);}
.bullet.warn{background:var(--warn);color:#1A1A1A;}
.sign-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px;}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:#fff;color:#0F2A43;font-weight:600;font-size:14px;text-decoration:none;border:1px solid #fff;cursor:pointer;}
.pill.ghost{background:transparent;color:#fff;border-color:var(--sign-muted);}
.sign-body{background:var(--surface);color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);}
.sign-body p{margin:0;font-size:14.5px;}
.sign-body .quiet{color:var(--muted);font-size:13.5px;}
.say{background:var(--bg);border-radius:10px;padding:10px 12px;}
.say .say-label{font-weight:600;font-size:13.5px;margin-bottom:4px;}
.say blockquote{margin:0 0 8px;font-size:14.5px;}
.copy{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;}
.nearby{align-self:stretch;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;}
.nearby h3{margin:0 0 6px;font-size:14.5px;font-weight:800;}
.nearby ul{list-style:none;margin:0;padding:0;}
.nearby li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;}
.nearby li:first-child{border-top:0;}
.nearby .sub{color:var(--muted);font-size:13.5px;}
.nearby a{color:inherit;font-weight:600;white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;}
.chip:hover{border-color:var(--ink);}
.fine{font-size:12.5px;color:var(--muted);align-self:flex-start;max-width:92%;}

/* composer */
.examples{display:flex;align-items:center;gap:8px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:thin;}
.examples span{flex:none;font-size:13px;color:var(--muted);}
.examples .chip{flex:none;white-space:nowrap;padding:6px 12px;font-size:13px;}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 14px;}
.composer textarea{flex:1;resize:none;max-height:110px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;line-height:1.35;}
.send{flex:none;height:44px;padding:0 18px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:800;cursor:pointer;}
.send:disabled{opacity:.45;cursor:not-allowed;}

/* study log dialog */
dialog{width:min(94vw,720px);max-height:86vh;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;}
dialog::backdrop{background:rgba(5,12,18,.55);}
.dlg{display:flex;flex-direction:column;max-height:86vh;}
.dlg header{padding:16px 18px 8px;}
.dlg h2{margin:0;font-size:19px;font-weight:800;}
.dlg .sub{margin:4px 0 0;color:var(--muted);font-size:13.5px;}
.dlg .tablewrap{overflow:auto;padding:0 18px;}
.dlg table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px;}
.dlg th,.dlg td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.dlg th{font-weight:800;position:sticky;top:0;background:var(--surface);}
.dlg footer{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>Insurance on the Go</h1>
      <p>Where to go for minor care</p>
    </div>
    <div class="top-actions">
      <button class="small-btn" id="logBtn" type="button">Study log</button>
      <button class="small-btn" id="resetBtn" type="button">Start over</button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<dialog id="logDlg" aria-labelledby="logTitle">
  <div class="dlg">
    <header>
      <h2 id="logTitle">Study log</h2>
      <p class="sub" id="logSub"></p>
    </header>
    <div class="tablewrap" id="logTable"></div>
    <footer>
      <button class="small-btn" id="dlBtn" type="button">Download CSV</button>
      <button class="small-btn" id="cpBtn" type="button">Copy CSV</button>
      <button class="small-btn" id="clrBtn" type="button">Clear log</button>
      <button class="small-btn" id="closeBtn" type="button">Close</button>
    </footer>
  </div>
</dialog>

        ', or go to the nearest ER. I cannot judge how serious a baby\u2019s symptoms are, so I will not point you to a clinic.')] };
    }

      return { log: { result: 'mental_health_pointer' }, nodes: [h('div', { class: 'msg bot' },
        'Counseling and mental health care at HUHS are covered by your Student Health Fee. To reach CAMHS urgent care, call ',
        h('a', { href: telHref(CAMHS_PHONE) }, CAMHS_PHONE), ' before you go in. If this is a crisis, call or text ',
        h('a', { href: 'tel:988' }, '988'), '.')] };

    if (!zone) { var pm = t.match(PLACE_CUE); if (pm) place = cleanPlace(pm[1]); }

    var child = CHILD_RE.test(t);

    if (C.awaitingLocation && !zone && !place && !hasProblem) place = cleanPlace(t);
    if (C.awaitingProblem && !hasProblem && !zone && !place) hasProblem = true;

    // "it's for my child" after an earlier answer

    var opener = prob && prob.child
      ? 'HUHS does not see children for sick visits. Your plan covers kids in network: $0 with Atrius Health providers and $35 with other in-network providers. I have not checked specific clinics near ' + place + ', so use Find a Doctor below.'
      : 'I do not have clinics checked near ' + place + ', so I will not guess. Your plan still covers you across the US through the Blue Cross PPO network.';
    var costs = prob && prob.child
      ? ['Out of network, a sick visit costs 30% after a $250 deductible.']
      : ['In network, urgent care is a $35 copay, and so is a doctor\u2019s office visit for a sick visit.',
         'Out of network, you pay 30% after a $250 deductible.',
         'Emergency room: $100 copay, waived if you are admitted.'];
    return [msg(opener),
      infoList(prob && prob.child ? 'Finding a doctor for your child' : 'What your plan pays away from Harvard',
        costs.concat([findDoctorItem(), memberItem(),
          ['HUHS can still advise by phone at ', h('a', { href: telHref(HUHS_PHONE) }, HUHS_PHONE), '. Ask whether a telemedicine visit is possible where you are.']])),
      finePrint()];
  }

  function recommend(prob, loc) {
    var C = S.ctx, nodes = [], area, need, rec = '';
    function done(result) {
      C.lastProblem = prob; C.problem = null; C.awaitingLocation = false; C.awaitingProblem = false;
      return { nodes: nodes, log: { result: result, area: area, need: need, recommended: rec }, askHeading: result === 'recommended' };
    }

    if (loc.unknown) {
      area = loc.unknown; need = prob.child ? 'child' : (prob.tele ? 'telehealth' : (prob.primary ? 'primary' : 'urgent'));
      nodes = awayNodes(loc.unknown, prob);
      return done('no_coverage');
    }

    var zone = loc.zone; area = ZONE_LABEL[zone];
    var anchor = loc.geo || loc.coords || ZONE_CENTER[zone];
    var exact = !!(loc.geo || loc.coords);
    var needs = prob.needs || [];

    if (prob.child) {
      need = 'child';
      nodes = awayNodes(area, prob);
      return done('no_coverage');
    }
    if (prob.tele) {
      need = 'telehealth'; rec = 'HUHS telemedicine';
      nodes = [msg('Telemedicine through HUHS costs nothing, so I would start there:'), buildHuhsTeleSign(), finePrint()];
      return done('recommended');
    }
    if (prob.primary) {
      need = 'primary'; rec = 'HUHS primary care';
      nodes = [msg('For a regular visit, your HUHS primary care team is the place to start:'), buildHuhsPrimarySign(), finePrint()];
      return done('recommended');
    }

    need = 'urgent'; rec = 'HUHS Urgent Care';
    var open = huhsOpen();
    var what = prob.kw && NOUN_REASON[prob.kw] ? ' for ' + NOUN_REASON[prob.kw] : '';
    var rows = rankNetwork(anchor, exact, needs);
    var extra = [];
    if (rows.length) {
      if (open) {
        extra = [nearbyBlock('If HUHS is too far or full, these clinics are in network ($35 copay)', rows.slice(0, 3))];
      } else {
        extra = [buildNetworkSign(rows[0], prob), nearbyBlock('More in-network clinics ($35 copay)', rows.slice(1, 3))];
      }
    } else {
      var items = [findDoctorItem()];
      if (!open) items.unshift('If it cannot wait until morning and the problem is serious, go to the ER or call 911. The ER copay is $100, waived if you are admitted.');
      items.unshift('Other urgent care that takes your plan costs a $35 copay per visit.');
      extra = [infoList(open ? 'Need another option?' : 'HUHS is closed right now', items)];
    }
    var where = loc.geo ? 'Near you' : 'In ' + area;
    var lead = where + ', I would start with HUHS' + what + ':';
    if (zone === 'boston' || loc.geo) lead = where + ', HUHS Urgent Care is free for you' + what + '. It is in Harvard Square:';
    if (!open && rows.length) lead = where + ', HUHS is closed right now. You can call its nurse advice line, or try an in-network clinic below. Call to confirm it is open:';
    nodes = [msg(lead), buildHuhsUrgentSign(prob, huhsLines(anchor, exact, needs))].concat(extra, [finePrint()]).filter(Boolean);
    return done('recommended');
  }

  /* ---------- study log ---------- */
  function logEvent(message, o) {
    var plan = planById(S.user.planId);
    var e = {
      time: new Date().toISOString(), name: S.user.name, plan: plan.short, message: message,
      area: o.area || '', need: o.need || '', result: o.result || '', recommended: o.recommended || '', heading: ''
    };
    S.log.push(e); store.set('ioth.harvard.log', S.log);
    return e;
  }
  function attachHeading(entry) {
    var row = h('div', { class: 'chips' });
    var q = h('p', { class: 'fine' }, 'Where are you heading?');
    ['To the first place', 'Somewhere else', 'Not sure yet'].forEach(function (label) {
      row.appendChild(h('button', { class: 'chip', type: 'button', onclick: function () {
        q.remove(); row.remove();
        addUser(label);
        entry.heading = label; store.set('ioth.harvard.log', S.log);
        addBot(label === 'To the first place' ? 'Good. Call ahead so they know you are coming. Feel better soon.'
          : label === 'Somewhere else' ? 'Okay. If it is not HUHS, ask whether they are in network for your Blue Cross PPO before you check in.'
          : 'No rush. Your options stay in the thread above.');
      } }, label));
    });
    chatEl.appendChild(q); chatEl.appendChild(row);
  }
  function csvEscape(v) { var s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function toCsv() {
    var cols = ['time', 'name', 'plan', 'message', 'area', 'need', 'result', 'recommended', 'heading'];
    var rows = [cols.join(',')];
    S.log.forEach(function (e) { rows.push(cols.map(function (c) { return csvEscape(e[c]); }).join(',')); });
    return rows.join('\n');
  }
  var dlg = document.getElementById('logDlg');
  function renderLog() {
    var n = S.log.length;
    var recs = S.log.filter(function (e) { return e.result === 'recommended'; }).length;
    var head = S.log.filter(function (e) { return e.heading === 'To the first place'; }).length;
    document.getElementById('logSub').textContent =
      n + ' entries. ' + recs + ' recommendations, ' + head + ' where the person said they were heading to the first place. Saved in this browser only.';
    var wrap = document.getElementById('logTable');
    if (!n) { wrap.replaceChildren(h('p', { class: 'sub' }, 'Nothing logged yet. Send a message in the chat to see entries here.')); return; }
    var cols = [['time', 'Time'], ['name', 'Name'], ['message', 'Message'], ['area', 'Area'], ['result', 'Result'], ['recommended', 'Recommended'], ['heading', 'Heading']];
    var table = h('table', null,
      h('thead', null, h('tr', null, cols.map(function (c) { return h('th', { scope: 'col' }, c[1]); }))),
      h('tbody', null, S.log.slice().reverse().map(function (e) {
        return h('tr', null, cols.map(function (c) {
          var v = e[c[0]] || '';
          if (c[0] === 'time') v = new Date(v).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return h('td', null, v);
        }));
      })));
    wrap.replaceChildren(table);
  }
  document.getElementById('logBtn').addEventListener('click', function () {
    renderLog();
    document.getElementById('dlBtn').hidden = !downloadsCap;
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  });
  document.getElementById('closeBtn').addEventListener('click', function () { dlg.close(); });
  document.getElementById('cpBtn').addEventListener('click', function (ev) { copyText(toCsv(), ev.currentTarget); });
  document.getElementById('clrBtn').addEventListener('click', function () {
    if (!S.log.length) return;
    if (window.confirm('Clear all log entries from this browser?')) { S.log = []; store.del('ioth.harvard.log'); renderLog(); }
  });
  document.getElementById('dlBtn').addEventListener('click', async function (ev) {
    var btn = ev.currentTarget, old = btn.textContent;
    if (!downloadsCap || !S.log.length) return;
    try { await downloadsCap.save({ filename: 'insurance-on-the-go-study-log.csv', data: toCsv() }); btn.textContent = 'Saved'; }
    catch (e) { btn.textContent = (e && e.code === 'declined') ? old : 'Use Copy CSV'; }
    setTimeout(function () { btn.textContent = old; }, 1600);
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    S.user = null; store.del('ioth.harvard.user'); renderIntake();
  });

  /* ---------- start ---------- */
  if (S.user && S.user.name && planById(S.user.planId).ok) renderChat(); else renderIntake();
})();
</script>
</body>
</html>
